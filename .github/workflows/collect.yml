name: collect-train-data

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay or skip runs)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-24.04   # pinned; ubuntu-latest moves to 26 on 2026-10-19
    env:
      MARTA_API_KEY: ${{ secrets.MARTA_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"   # don't let the project's renv take over in CI
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RPostgres
            any::httr
            any::jsonlite
            any::tidyverse
            any::janitor
      - run: Rscript collector/collect.R
